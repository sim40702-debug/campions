# Crea la release dell'anteprima per Mac e Windows.
#
# Parte da sola quando, su "main", cambia la versione in anteprima/package.json
# (per esempio da 0.1.0 a 0.1.1). Il tag "anteprima-v0.1.1" lo crea GitHub.
# Si puo' anche avviare a mano: Actions -> Release anteprima Ticino -> Run workflow.
#
# 0) "versione": legge la versione e controlla se la release esiste gia'
# 1) "app":  prende la mappa del cantone e la regione di Locarno dalla pre-release "ticino-completo-dati"
#            (dati VERI swisstopo e OpenStreetMap, preparati dal workflow "Ticino completo")
#            e costruisce l'app Electron su un Mac e su un PC Windows
# 2) "release": pubblica i file nella pagina Releases di GitHub

name: Release anteprima Ticino

on:
  push:
    branches: [main]
    paths:
      - "anteprima/**"
      - ".github/workflows/release-anteprima.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versione:
    runs-on: ubuntu-latest
    outputs:
      numero: ${{ steps.leggi.outputs.numero }}
      nuova: ${{ steps.leggi.outputs.nuova }}
    steps:
      - uses: actions/checkout@v4
      - id: leggi
        shell: bash
        run: |
          numero=$(node -p "require('./anteprima/package.json').version")
          echo "numero=$numero" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/anteprima-v$numero" > /dev/null; then
            echo "La release anteprima-v$numero esiste gia'"
            echo "nuova=false" >> $GITHUB_OUTPUT
          else
            echo "Nuova release: anteprima-v$numero"
            echo "nuova=true" >> $GITHUB_OUTPUT
          fi

  app:
    needs: versione
    if: needs.versione.outputs.nuova == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            comando: build:mac
            nome: mac
          - os: windows-latest
            comando: build:win
            nome: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Dalla 0.15.3 il gioco e' il TICINO COMPLETO: nell'app ci sono la mappa di tutto il cantone e la regione
      # di Locarno; le altre regioni il gioco le scarica da solo. I dati li prepara il workflow
      # "Ticino completo" e stanno nella pre-release "ticino-completo-dati".
      - name: Prendi la mappa del cantone e la regione di partenza (Locarno)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scarico anteprima/cantone anteprima/dati
          gh release download ticino-completo-dati -D scarico -p cantone.tar.gz -p regione_R_2696_1106.tar.gz
          tar -xzf scarico/cantone.tar.gz -C anteprima/cantone
          tar -xzf scarico/regione_R_2696_1106.tar.gz -C anteprima/dati
          ls anteprima/cantone anteprima/dati | head -40

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: anteprima/package-lock.json

      - name: Controlla i dati scaricati
        shell: bash
        run: |
          echo "::warning::dati prima della build (${{ matrix.nome }}): $(ls anteprima/dati 2>&1 | tr '\n' ' ')"

      - name: Installa
        working-directory: anteprima
        run: npm ci

      - name: Costruisci l'app
        working-directory: anteprima
        run: npm run ${{ matrix.comando }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Controlla che i dati siano dentro l'app
        working-directory: anteprima
        shell: bash
        run: |
          echo "::warning::cartelle in dist (${{ matrix.nome }}): $(find dist -maxdepth 5 -type d -name app -o -maxdepth 5 -type d -name '*.app' | tr '\n' ' ')"
          echo "::warning::contenuto app (${{ matrix.nome }}): $(find dist -maxdepth 6 -path '*app/*' -maxdepth 6 | grep -v node_modules | head -20 | tr '\n' ' ')"
          trovati=$(find dist -name terreno.bin -path "*app/dati/*" | wc -l)
          if [ "$trovati" -eq 0 ]; then
            echo "ERRORE: nell'app mancano i dati (dati/terreno.bin)"
            exit 1
          fi
          # BUG-008: i file che il gioco importa devono esserci tutti nell'app (non solo sul computer di sviluppo)
          for file in cantone/cantone.json cantone/regioni.json cantone/stato.json dati/terreno.json regioni_main.js terzi/three/loaders/GLTFLoader.js terzi/three/objects/Sky.js terzi/three/environments/RoomEnvironment.js \
                      node_modules/three/build/three.module.js src/gioco.js modelli/SM450_Telaio.glb; do
            if [ "$(find dist -path "*app/$file" | wc -l)" -eq 0 ]; then
              echo "::error::Nell'app manca $file"
              exit 1
            fi
          done
          # tutti i moduli del gioco (src/*.js) devono essere nell'app: un import mancante ferma il gioco
          for percorso in src/*.js; do
            nome=$(basename "$percorso")
            if [ "$(find dist -path "*app/src/$nome" | wc -l)" -eq 0 ]; then
              echo "::error::Nell'app manca src/$nome"
              exit 1
            fi
          done

      - name: Salva l'app
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.nome }}
          path: |
            anteprima/dist/*.dmg
            anteprima/dist/*.exe
          if-no-files-found: error

  release:
    needs: [versione, app]
    if: needs.versione.outputs.nuova == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prendi le app
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: uscita
          merge-multiple: true

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anteprima-v${{ needs.versione.outputs.numero }}
          target_commitish: ${{ github.sha }}
          name: "Anteprima Ticino ${{ needs.versione.outputs.numero }}"
          body_path: anteprima/NOTE_RELEASE.md
          files: uscita/*

# TICINO COMPLETO (branch feature/ticino-completo): tutto il cantone a regioni.
#
# Non tocca le release normali dell'anteprima (quelle partono solo da "main").
#
# 1) "osm":      scarica da OpenStreetMap i dati di TUTTO il cantone (a blocchi), decide le regioni,
#                crea la mappa del cantone e controlla che le strade siano collegate
# 2) "regione":  per ogni regione (24 x 24 km) esegue i passi 1, 3, 6, 7, 8, 9 e crea il pacchetto regione_R_....tar.gz
#                e il pacchetto facoltativo hd_R_....tar.gz (foto di dettaglio a 0,5 m, passo 9: il gioco lo scarica solo
#                con i profili Media, Alta e Ultra)
# 3) "pubblica": unisce i controlli e mette i pacchetti nella pre-release "ticino-completo-dati"
#                (il gioco li scarica da li' quando si entra in una regione nuova)
# 4) "app":      costruisce l'app per Mac e Windows (dentro c'e' gia' la regione di Locarno)
# 5) "release":  pubblica l'app come PRE-release "ticino-completo-vX" (non e' "l'ultima versione": chi usa
#                l'anteprima normale non la riceve come aggiornamento)
#
# I dati (lavori 1-3) si rifanno solo se il messaggio del commit contiene "[dati]" oppure avviando il workflow
# a mano con "dati" attivo. Altrimenti si rifa' solo l'app, con i dati gia' pubblicati.
# Per rifare solo alcune regioni: "[regioni:R_2712_1074,R_2696_1106]" nel messaggio del commit (o il campo
# "regioni" avviando a mano). Le altre regioni restano quelle gia' pubblicate.

name: Ticino completo

on:
  push:
    branches: [feature/ticino-completo]
    paths:
      - "anteprima/**"
      - "tools/geo/**"
      - ".github/workflows/ticino-completo.yml"
  workflow_dispatch:
    inputs:
      dati:
        description: "Rifare anche i dati di tutte le regioni"
        type: boolean
        default: false
      regioni:
        description: "Solo queste regioni (per esempio R_2712_1074,R_2696_1106). Vuoto = tutte"
        type: string
        default: ""
      solo_riconcilia:
        description: "SOLO riconciliazione di ponti e gallerie sui pacchetti gia' pubblicati + verifica del cantone. Non rifa' i dati, non crea foto HD, non costruisce l'app, non crea release ne' tag"
        type: boolean
        default: false
      pubblica_riconciliati:
        description: "Con solo_riconcilia: carica i pacchetti riconciliati (solo regione_R_*, mai hd_*) nella pre-release dei dati, sovrascrivendo quelli pubblicati. Lasciare spento per verificare prima"
        type: boolean
        default: false
      da_originali:
        description: "Con solo_riconcilia: parte dagli ORIGINALI conservati (artefatto 'originali-pubblicati' del run indicato, SHA-256 controllati) invece che dai pacchetti pubblicati; salva come artefatto i pacchetti oggi pubblicati prima di toccarli"
        type: boolean
        default: false
      run_originali:
        description: "Con da_originali: id del run che ha conservato gli originali"
        type: string
        default: "43397221897"
      attesi_cambiati:
        description: "Con pubblica_riconciliati: numero di pacchetti che devono risultare diversi da quelli pubblicati (il caricamento si ferma se e' un altro numero)"
        type: string
        default: "16"
      impronte_strade_attese:
        description: "Con da_originali: file nel repository con lo SHA-256 atteso di ogni strade.json prodotto (calcolo locale); se non coincide, il job si ferma"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

env:
  TAG_DATI: ticino-completo-dati

jobs:
  decidi:
    runs-on: ubuntu-latest
    outputs:
      dati: ${{ steps.d.outputs.dati }}
      numero: ${{ steps.d.outputs.numero }}
      solo: ${{ steps.d.outputs.solo }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        env:
          MESSAGGIO: ${{ github.event.head_commit.message }}
        run: |
          echo "numero=$(node -p "require('./anteprima/package.json').version")" >> $GITHUB_OUTPUT
          dati=false
          if [ "${{ inputs.dati }}" = "true" ]; then dati=true; fi
          case "$MESSAGGIO" in *"[dati]"*) dati=true;; esac
          solo="${{ inputs.regioni }}"
          nel_messaggio=$(echo "$MESSAGGIO" | grep -o '\[regioni:[A-Z0-9_,]*\]' | head -1 | sed 's/\[regioni://; s/\]//' || true)
          if [ -n "$nel_messaggio" ]; then solo="$nel_messaggio"; fi
          if [ -n "$solo" ]; then dati=true; fi
          echo "solo=$solo" >> $GITHUB_OUTPUT
          echo "Solo le regioni: ${solo:-tutte}"
          if [ "${{ inputs.solo_riconcilia }}" = "true" ]; then dati=false; fi
          echo "dati=$dati" >> $GITHUB_OUTPUT
          echo "Rifare i dati: $dati"

  osm:
    needs: decidi
    if: needs.decidi.outputs.dati == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      matrice: ${{ steps.regioni.outputs.matrice }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # I blocchi gia' scaricati si salvano sempre (anche se il lavoro fallisce): la volta dopo si riparte da li'
      - name: Riusa i dati OpenStreetMap gia' scaricati
        uses: actions/cache/restore@v4
        with:
          path: tools/geo/dati/download/osm
          key: osm-cantone-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            osm-cantone-

      - name: Installa le librerie Python
        run: pip install -r tools/geo/requirements.txt

      - name: Scarica OpenStreetMap per tutto il cantone
        working-directory: tools/geo
        shell: bash
        run: |
          set -o pipefail
          python -u cantone.py scarica 2>&1 | tee -a registro_cantone.txt

      - name: Salva i dati scaricati (anche se il passo e' fallito)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/geo/dati/download/osm
          key: osm-cantone-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Regioni, mappa del cantone e controllo delle strade
        id: regioni
        working-directory: tools/geo
        shell: bash
        run: |
          set -o pipefail
          python -u cantone.py regioni 2>&1 | tee -a registro_cantone.txt
          if [ -n "${{ needs.decidi.outputs.solo }}" ]; then
            echo "matrice=$(python -c "import json,sys; print(json.dumps([r for r in sys.argv[1].split(',') if r]))" "${{ needs.decidi.outputs.solo }}")" >> $GITHUB_OUTPUT
          else
            echo "matrice=$(grep '^MATRICE=' registro_cantone.txt | tail -1 | cut -d= -f2-)" >> $GITHUB_OUTPUT
          fi
          python -u cantone.py panoramica 2>&1 | tee -a registro_cantone.txt
          cp registro_cantone.txt dati/cantone/registro_cantone.txt

      - name: Riassunto
        if: always()
        shell: bash
        run: |
          echo '## Tutto il cantone' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -v "elementi$" tools/geo/registro_cantone.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Salva OpenStreetMap del cantone per le regioni
        uses: actions/upload-artifact@v4
        with:
          name: osm-cantone
          path: tools/geo/dati/download/osm
          retention-days: 3
          compression-level: 6

      - name: Salva la mappa del cantone
        uses: actions/upload-artifact@v4
        with:
          name: cantone-base
          path: tools/geo/dati/cantone
          retention-days: 7

  regione:
    needs: osm
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        id: ${{ fromJson(needs.osm.outputs.matrice) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa le librerie Python
        run: pip install -r tools/geo/requirements.txt

      - name: Prendi OpenStreetMap del cantone
        uses: actions/download-artifact@v4
        with:
          name: osm-cantone
          path: tools/geo/dati/download/osm

      - name: Passi 1, 3, 6, 7, 8, 9 sulla regione ${{ matrix.id }}
        working-directory: tools/geo
        shell: bash
        run: |
          set -o pipefail
          export MRW_AREA=$(python cantone.py area ${{ matrix.id }})
          echo "Regione ${{ matrix.id }}: MRW_AREA=$MRW_AREA" | tee -a registro.txt
          python -u cantone.py prepara 2>&1 | tee -a registro.txt
          for passo in passo1_scarica_altimetria passo3_crea_terreno passo6_verifica_terreno passo7_esporta_anteprima passo8_foto_aeree passo9_foto_dettaglio; do
            echo "===== $passo =====" | tee -a registro.txt
            python -u $passo.py --anteprima 2>&1 | grep -v "Catalogo swisstopo, pagina" | tee -a registro.txt
          done
          echo "===== controllo e pacchetto =====" | tee -a registro.txt
          python -u cantone.py chiudi ${{ matrix.id }} 2>&1 | tee -a registro.txt
          cp registro.txt dati/cantone/regioni_fatte/registro_${{ matrix.id }}.txt
          df -h . | tail -1

      - name: Se un passo fallisce, scrivi l'errore
        if: failure()
        shell: bash
        run: |
          echo "::error::${{ matrix.id }}: $(tail -c 1200 tools/geo/registro.txt | tr '\n' ' ')"

      - name: Riassunto
        if: always()
        shell: bash
        run: |
          echo '## Regione ${{ matrix.id }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 tools/geo/registro.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Salva il pacchetto della regione
        uses: actions/upload-artifact@v4
        with:
          name: regione-${{ matrix.id }}
          path: tools/geo/dati/cantone/regioni_fatte
          retention-days: 3
          compression-level: 0

  pubblica:
    needs: [osm, regione]
    # anche se una regione fallisce si pubblicano le altre (lo stato dice quali mancano)
    if: always() && needs.osm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa le librerie Python
        run: pip install -r tools/geo/requirements.txt

      - name: Prendi la mappa del cantone
        uses: actions/download-artifact@v4
        with:
          name: cantone-base
          path: tools/geo/dati/cantone

      - name: Prendi OpenStreetMap (servono i confini)
        uses: actions/download-artifact@v4
        with:
          name: osm-cantone
          path: tools/geo/dati/download/osm

      - name: Prendi i pacchetti delle regioni
        uses: actions/download-artifact@v4
        with:
          pattern: regione-*
          path: fatte
          merge-multiple: true

      # Se si sono rifatte solo alcune regioni, i rilievi e i controlli delle altre si riprendono dalla pre-release
      - name: Riprendi le regioni gia' pubblicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fatte
          gh release download "$TAG_DATI" -D fatte -p "rilievo_*.bin" -p "controllo_*.json" --skip-existing || true
          ls fatte | wc -l

      # Ponti e gallerie che attraversano il bordo di una regione devono avere la STESSA quota in tutte le regioni:
      # ogni regione li calcola da sola sul pezzo ritagliato, quindi qui (con tutte le regioni insieme) si ricalcolano sulle
      # opere intere. Servono tutte le 19 regioni anche se se ne e' rifatta una sola: le altre si prendono dalla pre-release.
      - name: Prendi le regioni non rifatte (servono tutte per le opere a cavallo dei bordi)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG_DATI" -D fatte -p "regione_R_*.tar.gz" --skip-existing || true
          ls fatte/regione_R_*.tar.gz | wc -l

      - name: Riconcilia ponti e gallerie tra le regioni
        working-directory: tools/geo
        shell: bash
        run: |
          set -o pipefail
          python -u riconcilia_opere.py --pacchetti ../../fatte --cantone dati/cantone --json ../../fatte/riconciliazione.json 2>&1 | tee riconciliazione.txt
          cp ../../fatte/riconciliazione.json ../../uscita_riconciliazione.json 2>/dev/null || true

      - name: Unisci rilievi e controlli
        working-directory: tools/geo
        shell: bash
        run: |
          set -o pipefail
          python -u cantone.py unisci ../../fatte 2>&1 | tee stato.txt
          echo '## Stato del Ticino completo' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat stato.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          mkdir -p ../../uscita
          tar -czf ../../uscita/cantone.tar.gz -C dati/cantone cantone.json regioni.json rilievo.bin stato.json verifica_strade.json
          cp dati/cantone/stato.json ../../uscita/stato.json
          for f in ../../fatte/registro_R_*.txt; do [ -f "$f" ] && cp "$f" ../../uscita/; done
          cp ../../fatte/regione_*.tar.gz ../../fatte/rilievo_*.bin ../../fatte/controllo_*.json ../../uscita/
          cp ../../fatte/hd_*.tar.gz ../../uscita/ 2>/dev/null || echo "nessun pacchetto HD"
          ls -la ../../uscita

      - name: Pubblica i dati nella pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG_DATI" > /dev/null 2>&1; then
            gh release create "$TAG_DATI" --prerelease --target "${{ github.sha }}" \
              --title "Ticino completo - dati delle regioni" \
              --notes "Pacchetti dei dati delle regioni del Canton Ticino per il branch feature/ticino-completo. Il gioco li scarica da qui. Dati: (c) OpenStreetMap contributors (ODbL), Ufficio federale di topografia swisstopo."
          fi
          gh release upload "$TAG_DATI" uscita/* --clobber

  # Modalita' "solo_riconcilia": prende i pacchetti GIA' PUBBLICATI, ricalcola le quote di ponti e gallerie a cavallo dei
  # bordi (riconcilia_opere.py), esegue le 11 verifiche di tutto il cantone sul risultato e lo salva come artefatto.
  # NON rifa' i dati da OpenStreetMap, NON crea foto HD, NON costruisce l'app, NON crea release ne' tag.
  # Scrive nella pre-release dei dati SOLO se "pubblica_riconciliati" e' attivo, e solo i regione_R_*.tar.gz cambiati.
  riconcilia:
    needs: decidi
    if: github.event_name == 'workflow_dispatch' && inputs.solo_riconcilia == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa le librerie Python
        run: pip install -r tools/geo/requirements.txt

      - name: Scarica i pacchetti pubblicati (solo lettura)
        if: inputs.da_originali != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fatte tools/geo/dati/cantone
          gh release download "$TAG_DATI" -D fatte -p "regione_R_*.tar.gz" -p cantone.tar.gz
          tar -xzf fatte/cantone.tar.gz -C tools/geo/dati/cantone
          ls fatte/regione_R_*.tar.gz | wc -l
          (cd fatte && sha256sum regione_R_*.tar.gz) > prima_sha256.txt

      # Modalita' da_originali: 1) i pacchetti OGGI pubblicati (v1) vengono controllati contro il registro e conservati per 90 giorni
      # (e' la copia per tornare indietro); 2) si parte dagli originali conservati, con SHA-256 controllati.
      - name: Scarica i pacchetti oggi pubblicati e controlla il registro (da_originali)
        if: inputs.da_originali == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p attuali
          gh release download "$TAG_DATI" -D attuali -p "regione_R_*.tar.gz" -p cantone.tar.gz
          (cd attuali && grep -E ' (regione_R_.*\.tar\.gz|cantone\.tar\.gz)$' ../docs/anteprima/ticino/pubblicato_dopo_sha256.txt | sha256sum -c -)
          (cd attuali && sha256sum regione_R_*.tar.gz) > attuali_sha256.txt
          wc -l < attuali_sha256.txt
      - name: Conserva i pacchetti oggi pubblicati (v1, artefatto per 90 giorni)
        if: inputs.da_originali == true
        uses: actions/upload-artifact@v4
        with:
          name: pubblicati-v1
          path: |
            attuali/regione_R_*.tar.gz
            attuali_sha256.txt
          retention-days: 90
          compression-level: 0
      - name: Scarica gli originali conservati (artefatto) e controlla gli SHA-256
        if: inputs.da_originali == true
        uses: actions/download-artifact@v4
        with:
          name: originali-pubblicati
          run-id: ${{ inputs.run_originali }}
          github-token: ${{ github.token }}
          path: originali_dl
      - name: Prepara gli originali
        if: inputs.da_originali == true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fatte tools/geo/dati/cantone
          cp originali_dl/fatte/regione_R_*.tar.gz originali_dl/fatte/cantone.tar.gz fatte/
          tar -xzf fatte/cantone.tar.gz -C tools/geo/dati/cantone
          ls fatte/regione_R_*.tar.gz | wc -l
          (cd fatte && sha256sum regione_R_*.tar.gz) > prima_sha256.txt

      # Gli originali devono essere ESATTAMENTE quelli registrati (docs/anteprima/ticino/pubblicato_prima_sha256.txt):
      # se qualcuno ha cambiato la pre-release nel frattempo, ci si ferma qui senza toccare niente.
      - name: Controlla che i pacchetti pubblicati siano quelli attesi (SHA-256)
        shell: bash
        run: |
          cd fatte
          grep -E ' (regione_R_.*\.tar\.gz|cantone\.tar\.gz)$' ../docs/anteprima/ticino/pubblicato_prima_sha256.txt > ../attesi.txt
          wc -l < ../attesi.txt
          sha256sum -c ../attesi.txt

      - name: Conserva gli originali (artefatto per 90 giorni)
        if: inputs.da_originali != true
        uses: actions/upload-artifact@v4
        with:
          name: originali-pubblicati
          path: |
            fatte/regione_R_*.tar.gz
            fatte/cantone.tar.gz
            docs/anteprima/ticino/pubblicato_prima_sha256.txt
          retention-days: 90
          compression-level: 0

      - name: Verifica PRIMA della riconciliazione (stato pubblicato)
        working-directory: tools/geo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../scompatta_prima
          for p in ../../fatte/regione_R_*.tar.gz; do
            id=$(basename "$p" .tar.gz); id=${id#regione_}
            mkdir -p ../../scompatta_prima/$id
            tar -xzf "$p" -C ../../scompatta_prima/$id
          done
          cp -r dati/cantone ../../scompatta_prima/cantone
          python -u verifica_cantone.py ../../scompatta_prima --json ../../verifica_prima.json 2>&1 | tee ../../verifica_prima.txt || true
          rm -rf ../../scompatta_prima

      - name: Riconcilia ponti e gallerie
        working-directory: tools/geo
        shell: bash
        run: |
          set -o pipefail
          python -u riconcilia_opere.py --pacchetti ../../fatte --cantone dati/cantone --json ../../riconciliazione.json 2>&1 | tee ../../riconciliazione.txt

      - name: Verifica DOPO la riconciliazione (11 controlli, deve passare tutto)
        working-directory: tools/geo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../scompatta_dopo
          for p in ../../fatte/regione_R_*.tar.gz; do
            id=$(basename "$p" .tar.gz); id=${id#regione_}
            mkdir -p ../../scompatta_dopo/$id
            tar -xzf "$p" -C ../../scompatta_dopo/$id
          done
          cp -r dati/cantone ../../scompatta_dopo/cantone
          python -u verifica_cantone.py ../../scompatta_dopo --json ../../verifica_dopo.json 2>&1 | tee ../../verifica_dopo.txt
          # impronta di ogni strade.json (per confrontarla con il calcolo locale)
          (cd ../../scompatta_dopo && for d in R_*; do echo "$(sha256sum $d/strade.json | cut -d' ' -f1)  $d"; done) > ../../strade_sha256.txt
          cat ../../strade_sha256.txt
          if [ -n "${{ inputs.impronte_strade_attese }}" ]; then
            # il calcolo locale (stessi dati di partenza, stesso codice) deve dare gli stessi strade.json
            sort -k2 ../../${{ inputs.impronte_strade_attese }} > ../../attese_strade.txt
            sort -k2 ../../strade_sha256.txt > ../../prodotte_strade.txt
            diff ../../attese_strade.txt ../../prodotte_strade.txt && echo "strade.json prodotti = quelli calcolati in locale (19/19)"
          fi
          rm -rf ../../scompatta_dopo
          (cd ../../fatte && sha256sum regione_R_*.tar.gz) > ../../dopo_sha256.txt
          # nessun pacchetto HD deve essere presente
          if ls ../../fatte/hd_* > /dev/null 2>&1; then echo "::error::ci sono pacchetti HD: non devono esserci"; exit 1; fi

      - name: Riassunto
        if: always()
        shell: bash
        run: |
          echo '## Riconciliazione ponti e gallerie' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 riconciliazione.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '## Verifica del cantone dopo la riconciliazione' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 verifica_dopo.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Salva i risultati (pacchetti riconciliati, verifiche, impronte)
        uses: actions/upload-artifact@v4
        with:
          name: riconciliati
          path: |
            fatte/regione_R_*.tar.gz
            riconciliazione.json
            riconciliazione.txt
            verifica_prima.json
            verifica_prima.txt
            verifica_dopo.json
            verifica_dopo.txt
            prima_sha256.txt
            dopo_sha256.txt
            strade_sha256.txt
          retention-days: 7
          compression-level: 0

      - name: Pubblica i pacchetti riconciliati nella pre-release dei dati (solo se richiesto)
        if: inputs.pubblica_riconciliati == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # solo i regione_R_* che sono davvero cambiati: niente HD, niente app, nessun nuovo tag, nessun altro file
          mkdir -p cambiati
          if [ "${{ inputs.da_originali }}" = "true" ]; then
            # confronto sul CONTENUTO (il gzip non e' riproducibile byte per byte): si carica solo se strade.json e' diverso da quello oggi pubblicato
            for f in fatte/regione_R_*.tar.gz; do
              nome=$(basename "$f")
              nuovo=$(tar -xzOf "$f" strade.json | sha256sum | cut -d' ' -f1)
              attuale=$(tar -xzOf "attuali/$nome" strade.json | sha256sum | cut -d' ' -f1)
              if [ "$nuovo" != "$attuale" ]; then
                cp "$f" cambiati/
                # tutto il resto del pacchetto deve essere identico a quello oggi pubblicato (stessi membri, stesse dimensioni)
                diff <(tar -tvzf "$f" | grep -v ' strade.json$' | awk '{print $3, $6}' | sort) <(tar -tvzf "attuali/$nome" | grep -v ' strade.json$' | awk '{print $3, $6}' | sort) > /dev/null \
                  || { echo "::error::$nome: i membri diversi da strade.json non coincidono con quelli pubblicati"; exit 1; }
              fi
            done
          else
            while read -r hash nome; do
              vecchio=$(grep " $nome\$" prima_sha256.txt | cut -d' ' -f1)
              if [ "$hash" != "$vecchio" ]; then cp "fatte/$nome" cambiati/; fi
            done < dopo_sha256.txt
          fi
          n=$(ls cambiati | wc -l)
          echo "pacchetti cambiati: $n"; ls -la cambiati
          if [ "$n" != "${{ inputs.attesi_cambiati }}" ]; then echo "::error::attesi ${{ inputs.attesi_cambiati }} pacchetti modificati, trovati $n: mi fermo senza caricare niente"; exit 1; fi
          if ls cambiati | grep -v '^regione_R_.*\.tar\.gz$'; then echo "::error::file non previsti"; exit 1; fi
          # stato della pre-release PRIMA (nome + impronta di ogni asset)
          gh api "repos/${{ github.repository }}/releases/tags/$TAG_DATI" --jq '.assets[] | "\(.name) \(.digest)"' | sort > release_prima.txt
          wc -l < release_prima.txt
          # un file alla volta: carico, riscarico, confronto; al primo scostamento si interrompe
          mkdir -p riscaricati
          for f in cambiati/regione_R_*.tar.gz; do
            nome=$(basename "$f")
            atteso=$(sha256sum "$f" | cut -d' ' -f1)
            gh release upload "$TAG_DATI" "$f" --clobber
            rm -f "riscaricati/$nome"
            gh release download "$TAG_DATI" -D riscaricati -p "$nome"
            trovato=$(sha256sum "riscaricati/$nome" | cut -d' ' -f1)
            if [ "$atteso" != "$trovato" ]; then echo "::error::$nome: impronta diversa dopo il caricamento ($atteso contro $trovato). INTERROTTO: nessun altro file e' stato toccato."; exit 1; fi
            tar -tzf "riscaricati/$nome" > /dev/null
            echo "OK $nome $atteso"
          done
          # stato DOPO: devono essere cambiati solo quei 16 asset, niente aggiunto o tolto, nessun hd_*
          gh api "repos/${{ github.repository }}/releases/tags/$TAG_DATI" --jq '.assets[] | "\(.name) \(.digest)"' | sort > release_dopo.txt
          diff <(cut -d' ' -f1 release_prima.txt) <(cut -d' ' -f1 release_dopo.txt) || { echo "::error::elenco di asset cambiato"; exit 1; }
          echo "stesso elenco di asset"
          cambiati_nomi=$({ diff release_prima.txt release_dopo.txt || true; } | grep '^>' | cut -d' ' -f2 | sort)
          echo "$cambiati_nomi" | wc -l
          if [ "$(echo "$cambiati_nomi" | wc -l)" != "${{ inputs.attesi_cambiati }}" ] || [ "$cambiati_nomi" != "$(ls cambiati | sort)" ]; then echo "::error::asset cambiati diversi da quelli previsti"; exit 1; fi
          if grep -q '^hd_' release_dopo.txt; then echo "::error::pacchetti HD nella pre-release"; exit 1; fi
          cp release_prima.txt release_dopo.txt cambiati/ 2>/dev/null || true
          (cd cambiati && sha256sum regione_R_*.tar.gz) > pubblicati_sha256.txt

      - name: Salva il registro della pubblicazione
        if: inputs.pubblica_riconciliati == true
        uses: actions/upload-artifact@v4
        with:
          name: registro-pubblicazione
          path: |
            release_prima.txt
            release_dopo.txt
            pubblicati_sha256.txt
          retention-days: 90

  app:
    needs: [decidi, pubblica]
    if: always() && inputs.solo_riconcilia != true && (needs.pubblica.result == 'success' || needs.pubblica.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            comando: build:mac
            nome: mac
          - os: windows-latest
            comando: build:win
            nome: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Prendi la mappa del cantone e la regione di partenza (Locarno)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scarico anteprima/cantone anteprima/dati
          gh release download "$TAG_DATI" -D scarico -p cantone.tar.gz -p regione_R_2696_1106.tar.gz
          tar -xzf scarico/cantone.tar.gz -C anteprima/cantone
          tar -xzf scarico/regione_R_2696_1106.tar.gz -C anteprima/dati
          # foto di dettaglio a 0,5 m della regione di Locarno (facoltative: se il pacchetto non c'e' l'app funziona lo stesso)
          if gh release download "$TAG_DATI" -D scarico -p hd_R_2696_1106.tar.gz; then
            tar -xzf scarico/hd_R_2696_1106.tar.gz -C anteprima/dati
          else
            echo "nessun pacchetto HD per Locarno"
          fi
          ls anteprima/cantone anteprima/dati | head -40

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze
        working-directory: anteprima
        run: npm ci

      - name: Costruisci l'app
        working-directory: anteprima
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.comando }}

      - name: Controlla che nell'app ci sia tutto
        shell: bash
        run: |
          cd anteprima/dist
          ls -la
          trovati=$(find . -path "*app/cantone/cantone.json" | wc -l)
          terzi=$(find . -path "*app/terzi/three/loaders/GLTFLoader.js" | wc -l)
          terreno=$(find . -path "*app/dati/terreno.json" | wc -l)
          echo "cantone: $trovati, terzi: $terzi, terreno: $terreno"
          if [ "$trovati" = "0" ] || [ "$terzi" = "0" ] || [ "$terreno" = "0" ]; then
            echo "::error::Nell'app mancano dei file (cantone, terzi o terreno)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.nome }}
          path: |
            anteprima/dist/*.dmg
            anteprima/dist/*.exe
          compression-level: 0
          retention-days: 7

  release:
    needs: [decidi, app]
    if: always() && needs.app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: uscita
          merge-multiple: true
      - name: Pubblica la pre-release dell'app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ticino-completo-v${{ needs.decidi.outputs.numero }}"
          ls -la uscita
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" uscita/* --clobber
          else
            gh release create "$tag" uscita/* --prerelease --target "${{ github.sha }}" \
              --title "Ticino completo ${{ needs.decidi.outputs.numero }} (prova, branch feature/ticino-completo)" \
              --notes-file anteprima/NOTE_TICINO_COMPLETO.md
          fi

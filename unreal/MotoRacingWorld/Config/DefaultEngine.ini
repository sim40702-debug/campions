; Ticino Motorcycle Simulator - impostazioni comuni a Windows e Mac
; Illuminazione completamente dinamica: Lumen, Nanite, Virtual Shadow Maps, TSR.

[/Script/Engine.RendererSettings]
; Lumen per luce indiretta (GI) e riflessi
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.GenerateMeshDistanceFields=True
; Ombre virtuali e geometria Nanite
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
; Anti-aliasing: Temporal Super Resolution
r.AntiAliasingMethod=4
; Niente luce "cotta": giorno/notte e meteo dinamici
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True
r.CustomDepth=3
r.VirtualTextures=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/MacTargetPlatform.MacTargetSettings]
; SM6 per Mac M2 o piu' recenti (Nanite e ombre virtuali, serve macOS 15+),
; SM5 come riserva per i Mac M1
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6
+TargetedRHIs=SF_METAL_SM5

[/Script/Engine.Engine]
bSmoothFrameRate=False

; Mappa e regole del gioco
[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/MotoRacingWorld.MRWGameMode
EditorStartupMap=/Game/Mappe/Ticino_Locarnese.Ticino_Locarnese
GameDefaultMap=/Game/Mappe/Ticino_Locarnese.Ticino_Locarnese
